name: Build native YouTube engine from Maxd source (experimental)
on:
  workflow_dispatch:
  push:
    branches: [feature/maxd-native-port]
    paths:
      - '.github/workflows/maxd-native.yml'
permissions:
  contents: read
jobs:
  build-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Checkout GPL native YouTube engine source
        run: |
          git clone --recursive https://github.com/HandshakeHackin/youtube-maxd.git maxd-upstream
          cd maxd-upstream
          git rev-parse HEAD | tee "$GITHUB_WORKSPACE/MAXD_SOURCE_COMMIT"
      - name: Install native PS5 toolchain and media dependencies
        run: |
          cd maxd-upstream
          make host-deps
          make deps
      - name: Build native player and verify packaging
        run: |
          cd maxd-upstream
          make zip
          test -s dist/PPSA99991.zip
      - name: Upload native engine build for integration testing
        uses: actions/upload-artifact@v4
        with:
          name: ScrewU2Music-Maxd-Native-Engine-EXPERIMENTAL
          path: |
            maxd-upstream/dist/PPSA99991.zip
            MAXD_SOURCE_COMMIT
          if-no-files-found: error
