name: Build ScrewU2Music
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang-18 lld-18 llvm-18 make cmake pkg-config git python3 wget
      - name: Fetch PS5 payload SDK
        run: git clone --depth 1 https://github.com/ps5-payload-dev/sdk.git ps5-sdk
      - name: Build SDK and browser sample
        shell: bash
        run: |
          set -euxo pipefail
          cd ps5-sdk
          make
          make DESTDIR="$GITHUB_WORKSPACE/ps5-payload-sdk" install
          cp ../main.c samples/browser/main.c
          PS5_PAYLOAD_SDK="$GITHUB_WORKSPACE/ps5-payload-sdk" make -C samples/browser
      - name: Collect ELF
        shell: bash
        run: |
          set -euo pipefail
          find ps5-sdk/samples/browser -type f -name '*.elf' -print
          ELF=$(find ps5-sdk/samples/browser -type f -name '*.elf' | head -n 1)
          test -n "$ELF"
          cp "$ELF" ScrewU2Music.elf
      - uses: actions/upload-artifact@v4
        with:
          name: ScrewU2Music_latest_elf
          path: ScrewU2Music.elf
      - name: Publish stable latest ELF download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view auto-latest >/dev/null 2>&1; then
            gh release create auto-latest --title "ScrewU2Music latest" --notes "Rolling experimental ELF build from main. Not a functional native music player." --latest
          fi
          gh release upload auto-latest ScrewU2Music.elf --clobber
