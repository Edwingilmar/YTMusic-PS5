name: Build ScrewU2Music v0.6 UI server test
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang-18 lld-18 llvm-18 make cmake pkg-config git python3 wget
      - name: Fetch PS5 payload SDK
        run: git clone --depth 1 https://github.com/ps5-payload-dev/sdk.git ps5-sdk
      - name: Build SDK and v0.6 local UI server
        shell: bash
        run: |
          set -euxo pipefail
          cd ps5-sdk
          make
          make DESTDIR="$GITHUB_WORKSPACE/ps5-payload-sdk" install
          cp ../ui_server_test.c samples/notify/main.c
          sed -i 's/-lSceNotification/-lSceNotification -lSceSystemService -lSceUserService/' samples/notify/Makefile
          PS5_PAYLOAD_SDK="$GITHUB_WORKSPACE/ps5-payload-sdk" make -C samples/notify
      - name: Collect ELF
        shell: bash
        run: |
          set -euo pipefail
          find ps5-sdk/samples/notify -type f -name '*.elf' -print
          ELF=$(find ps5-sdk/samples/notify -type f -name '*.elf' | head -n 1)
          test -n "$ELF"
          cp "$ELF" ScrewU2Music.elf
      - uses: actions/upload-artifact@v4
        with:
          name: ScrewU2Music_v06_ui_server_elf
          path: ScrewU2Music.elf
