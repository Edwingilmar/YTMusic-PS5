name: Build ScrewU2Music PS5 tile installation kit
on:
  workflow_dispatch:
  push:
    branches: [main, feature/embedded-music-player, feature/maxd-native-port]
    paths:
      - 'ps5-app/**'
      - 'assets/logo.svg'
      - '.github/workflows/build-tile.yml'
      - '.github/workflows/maxd-native.yml'
concurrency:
  group: screwu2music-release-publisher
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build-tile:
    if: github.ref != 'refs/heads/feature/maxd-native-port'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang-18 lld-18 llvm-18 make python3 python3-pip python3-cairosvg imagemagick git
      - name: Fetch and install PS5 payload SDK
        run: |
          git clone --depth 1 https://github.com/ps5-payload-dev/sdk.git ps5-sdk
          make -C ps5-sdk
          make -C ps5-sdk DESTDIR="$GITHUB_WORKSPACE/ps5-payload-sdk" install
      - name: Build tile app and installation payload
        shell: bash
        run: |
          set -euxo pipefail
          export PS5_PAYLOAD_SDK="$GITHUB_WORKSPACE/ps5-payload-sdk"
          cd ps5-sdk/samples/install_app
          cp "$GITHUB_WORKSPACE/ps5-app/eboot.c" eboot.c
          python3 - <<'PY'
          from pathlib import Path
          page = Path("../../../prototype/index.html").read_bytes()
          Path("ui_page.h").write_text("static const char page[] = {"+",".join(str(b) for b in page)+",0};\n")
          logo = Path("../../../assets/logo.svg").read_bytes()
          Path("logo_asset.h").write_text("static const char logo_svg[] = {"+",".join(str(b) for b in logo)+",0};\\n".replace("\\n","\n"))
          PY
          sed -i 's/TITLE_ID := FAKE02932/TITLE_ID := SCUM00002/' Makefile
          mkdir -p SCUM00002/sce_sys
          cp "$GITHUB_WORKSPACE/ps5-app/sce_sys/param.json" SCUM00002/sce_sys/param.json
          cp SCUM00002/sce_sys/param.json SCUM00002/sce_sys/param.json.system
          python3 -c 'import cairosvg; cairosvg.svg2png(url="'$GITHUB_WORKSPACE'/assets/logo.svg",write_to="SCUM00002/icon0.png",output_width=512,output_height=512)'
          sed -i 's/^LDADD\s*:=.*/LDADD := -lSceNet -lSceUserService -lSceSystemService/' Makefile
          make SCUM00002/eboot.bin
          test -s SCUM00002/eboot.bin
          # Embed the signed eboot, icon and metadata directly in a single installer ELF.
          cp "$GITHUB_WORKSPACE/ps5-app/one_click_installer.c" payload.c
          sed -i "s/SCREWU2_BUILD \"local\"/SCREWU2_BUILD \"${GITHUB_RUN_NUMBER}\"/" payload.c
          make payload.elf LDADD="-lSceIpmi -lSceAppInstUtil -lSceUserService -lSceSystemService -lSceNet"
          mkdir -p "$GITHUB_WORKSPACE/tile-kit/SCUM00002/sce_sys"
          cp "$GITHUB_WORKSPACE/ps5-app/stage_tile.py" "$GITHUB_WORKSPACE/tile-kit/stage_tile.py"
          cp payload.elf "$GITHUB_WORKSPACE/tile-kit/ScrewU2Music-install.elf"
          cp SCUM00002/eboot.bin "$GITHUB_WORKSPACE/tile-kit/SCUM00002/eboot.bin"
          cp SCUM00002/icon0.png "$GITHUB_WORKSPACE/tile-kit/SCUM00002/icon0.png"
          cp SCUM00002/sce_sys/param.json* "$GITHUB_WORKSPACE/tile-kit/SCUM00002/sce_sys/"
      - name: Upload installation kit
        uses: actions/upload-artifact@v4
        with:
          name: ScrewU2Music-OneClick-Installer-EXPERIMENTAL
          path: tile-kit/
          if-no-files-found: error
      - name: Publish latest installer to stable release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp tile-kit/ScrewU2Music-install.elf ScrewU2Music.elf
          if ! gh release view auto-latest >/dev/null 2>&1; then
            gh release create auto-latest --title "ScrewU2Music latest installer" --notes "Experimental PS5 one-ELF installer. Installs and attempts to launch ScrewU2Music." --latest
          fi
          cp tile-kit/SCUM00002/eboot.bin ScrewU2Music-eboot.bin
          cp tile-kit/SCUM00002/icon0.png ScrewU2Music-icon0.png
          cp tile-kit/SCUM00002/sce_sys/param.json ScrewU2Music-param.json
          gh release upload auto-latest ScrewU2Music.elf ScrewU2Music-eboot.bin ScrewU2Music-icon0.png ScrewU2Music-param.json --clobber
      - name: Update Payload Manager catalog version and checksum
        if: github.ref == 'refs/heads/main'
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, datetime
          catalog = pathlib.Path('catalog/payloads.json')
          data = json.loads(catalog.read_text())
          item = next(p for p in data['payloads'] if p['id'] == 'screwu2music')
          item['version'] = '1.0.' + os.environ['BUILD_NUMBER']
          item['url'] = 'https://github.com/Edwingilmar/YTMusic-PS5/releases/download/auto-latest/ScrewU2Music.elf'
          item['last_update'] = datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          item['checksum'] = hashlib.sha256(pathlib.Path('ScrewU2Music.elf').read_bytes()).hexdigest()
          catalog.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp ScrewU2Music.elf catalog/ScrewU2Music.elf
          cp ScrewU2Music-eboot.bin catalog/ScrewU2Music-eboot.bin
          cp ScrewU2Music-icon0.png catalog/ScrewU2Music-icon0.png
          cp ScrewU2Music-param.json catalog/ScrewU2Music-param.json
          git add catalog/payloads.json catalog/ScrewU2Music.elf catalog/ScrewU2Music-eboot.bin catalog/ScrewU2Music-icon0.png catalog/ScrewU2Music-param.json
          if ! git diff --cached --quiet; then
            git commit -m "Update ScrewU2Music catalog to build $BUILD_NUMBER [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

  build-native-screwu2music:
    if: github.ref == 'refs/heads/feature/maxd-native-port'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang-18 lld-18 llvm-18 make python3 git
      - name: Build integrated native YouTube Music app
        run: |
          git clone https://github.com/HandshakeHackin/youtube-maxd.git maxd-upstream
          cd maxd-upstream
          make host-deps
          make deps
          make zip
          test -s dist/PPSA99991.zip
      - name: Build one ELF containing native application
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/ps5-payload-dev/sdk.git ps5-sdk
          make -C ps5-sdk
          make -C ps5-sdk DESTDIR="$GITHUB_WORKSPACE/ps5-payload-sdk" install
          export PS5_PAYLOAD_SDK="$GITHUB_WORKSPACE/ps5-payload-sdk"
          cd ps5-sdk/samples/install_app
          sed -i 's/TITLE_ID := FAKE02932/TITLE_ID := PPSA99991/' Makefile
          python3 "$GITHUB_WORKSPACE/ps5-app/build_native_installer.py" "$GITHUB_WORKSPACE/maxd-upstream/dist/PPSA99991.zip" payload.c "$PWD"
          { make payload.elf LDADD="-lSceIpmi -lSceAppInstUtil -lSceUserService -lSceSystemService -lSceNet" 2>&1 | tee "$GITHUB_WORKSPACE/native-elf-build.log"; }
          cp payload.elf "$GITHUB_WORKSPACE/ScrewU2Music-Native.elf"
          test -s "$GITHUB_WORKSPACE/ScrewU2Music-Native.elf"
      - name: Upload compiler diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ScrewU2Music-ELF-build-errors
          path: native-elf-build.log
          if-no-files-found: warn
      - name: Upload single integrated installer
        uses: actions/upload-artifact@v4
        with:
          name: ScrewU2Music-Native-OneELF
          path: ScrewU2Music-Native.elf
          if-no-files-found: error
