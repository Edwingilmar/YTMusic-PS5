name: Build ScrewU2Music PS5 tile installation kit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ps5-app/**'
      - 'assets/logo.svg'
      - '.github/workflows/build-tile.yml'
concurrency:
  group: screwu2music-release-publisher
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build-tile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang-18 lld-18 llvm-18 make python3 python3-pip python3-cairosvg imagemagick git
      - name: Fetch and install PS5 payload SDK
        run: |
          git clone --depth 1 https://github.com/ps5-payload-dev/sdk.git ps5-sdk
          make -C ps5-sdk
          make -C ps5-sdk DESTDIR="$GITHUB_WORKSPACE/ps5-payload-sdk" install
      - name: Build tile app and installation payload
        shell: bash
        run: |
          set -euxo pipefail
          export PS5_PAYLOAD_SDK="$GITHUB_WORKSPACE/ps5-payload-sdk"
          cd ps5-sdk/samples/install_app
          cp "$GITHUB_WORKSPACE/ps5-app/eboot.c" eboot.c
          sed -i 's/TITLE_ID := FAKE02932/TITLE_ID := SCUM00001/' Makefile
          mkdir -p SCUM00001/sce_sys
          cp "$GITHUB_WORKSPACE/ps5-app/sce_sys/param.json" SCUM00001/sce_sys/param.json
          cp SCUM00001/sce_sys/param.json SCUM00001/sce_sys/param.json.system
          python3 -c 'import cairosvg; cairosvg.svg2png(url="'$GITHUB_WORKSPACE'/assets/logo.svg",write_to="SCUM00001/icon0.png",output_width=512,output_height=512)'
          # SDK sample links its eboot statically, which cannot resolve system services.
          # Build our browser-launching eboot dynamically and fake-sign the resulting SELF.
          "$PS5_PAYLOAD_SDK/bin/prospero-clang" -Wall -g -lSceSystemService -lSceUserService -o eboot.elf eboot.c
          python3 -c 'import struct; p="eboot.elf"; f=open(p,"r+b"); f.seek(16); f.write(struct.pack("<H",0xFE18)); f.close()'
          python3 -c 'import struct; f=open("eboot.elf","rb"); f.seek(16); assert struct.unpack("<H",f.read(2))[0] == 0xFE18, "Incorrect PS5 ELF type"'
          python3 make_fself.py --ptype fake --paid 0x3800000000000022 --app-version 0x07590001 --fw-version 0x07590001 eboot.elf SCUM00001/eboot.bin
          # Embed the signed eboot, icon and metadata directly in a single installer ELF.
          cp "$GITHUB_WORKSPACE/ps5-app/one_click_installer.c" payload.c
          make payload.elf LDADD="-lSceIpmi -lSceAppInstUtil -lSceUserService -lSceSystemService -lSceNet -lSceSsl -lSceHttp"
          mkdir -p "$GITHUB_WORKSPACE/tile-kit/SCUM00001/sce_sys"
          cp "$GITHUB_WORKSPACE/ps5-app/stage_tile.py" "$GITHUB_WORKSPACE/tile-kit/stage_tile.py"
          cp payload.elf "$GITHUB_WORKSPACE/tile-kit/ScrewU2Music-install.elf"
          cp SCUM00001/eboot.bin "$GITHUB_WORKSPACE/tile-kit/SCUM00001/eboot.bin"
          cp SCUM00001/icon0.png "$GITHUB_WORKSPACE/tile-kit/SCUM00001/icon0.png"
          cp SCUM00001/sce_sys/param.json* "$GITHUB_WORKSPACE/tile-kit/SCUM00001/sce_sys/"
      - name: Upload installation kit
        uses: actions/upload-artifact@v4
        with:
          name: ScrewU2Music-OneClick-Installer-EXPERIMENTAL
          path: tile-kit/
          if-no-files-found: error
      - name: Publish latest installer to stable release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp tile-kit/ScrewU2Music-install.elf ScrewU2Music.elf
          if ! gh release view auto-latest >/dev/null 2>&1; then
            gh release create auto-latest --title "ScrewU2Music latest installer" --notes "Experimental PS5 one-ELF installer. Installs and attempts to launch ScrewU2Music." --latest
          fi
          cp tile-kit/SCUM00001/eboot.bin ScrewU2Music-eboot.bin
          cp tile-kit/SCUM00001/icon0.png ScrewU2Music-icon0.png
          cp tile-kit/SCUM00001/sce_sys/param.json ScrewU2Music-param.json
          gh release upload auto-latest ScrewU2Music.elf ScrewU2Music-eboot.bin ScrewU2Music-icon0.png ScrewU2Music-param.json --clobber
      - name: Update Payload Manager catalog version and checksum
        if: github.ref == 'refs/heads/main'
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, datetime
          catalog = pathlib.Path('catalog/payloads.json')
          data = json.loads(catalog.read_text())
          item = next(p for p in data['payloads'] if p['id'] == 'screwu2music')
          item['version'] = '1.0.' + os.environ['BUILD_NUMBER']
          item['url'] = 'https://raw.githubusercontent.com/Edwingilmar/YTMusic-PS5/main/catalog/ScrewU2Music.elf'
          item['last_update'] = datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          item['checksum'] = hashlib.sha256(pathlib.Path('ScrewU2Music.elf').read_bytes()).hexdigest()
          catalog.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp ScrewU2Music.elf catalog/ScrewU2Music.elf
          git add catalog/payloads.json catalog/ScrewU2Music.elf
          if ! git diff --cached --quiet; then
            git commit -m "Update ScrewU2Music catalog to build $BUILD_NUMBER [skip ci]"
            git push origin HEAD:main
          fi
